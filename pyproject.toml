[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-board"
version = "0.3.0"
description = "Atlas: a personal AI finance board (phase 1: books, prices, risk rules, text chat)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "httpx2>=2.13",
  "apscheduler>=3.10,<4",
  "anthropic>=2.14",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]  # httpx: FastAPI TestClient
phone = ["qrcode>=7"]  # prints a QR code for `atlas serve --phone`

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
"atlas.sample_data" = ["*.csv", "*.json"]
"atlas.web" = ["*.html", "*.js", "*.webmanifest", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
