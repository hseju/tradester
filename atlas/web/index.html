<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas</title>
<meta name="theme-color" content="#03070A">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atlas">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="scan" aria-hidden="true"></div>
<main id="app" aria-live="polite"></main>
<nav id="nav" class="nav" hidden>
  <a href="#board" class="navbtn" aria-label="The board">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="5" r="2"/><circle cx="20" cy="5" r="2"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="19" r="2"/><path d="M6 6.5l3.6 3.6M18 6.5l-3.6 3.6M6 17.5l3.6-3.6M18 17.5l-3.6-3.6"/></svg>
  </a>
  <a href="#home" class="navbtn" aria-label="Home">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>
  </a>
  <a href="#chat" class="orb" aria-label="Talk to Atlas">
    <svg width="78" height="78" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="48" fill="#03070A" stroke="#12505E" stroke-width="1"/>
      <circle cx="50" cy="50" r="44" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="14 8" class="spin"/>
      <circle cx="50" cy="50" r="35" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" class="spinr"/>
      <circle cx="50" cy="50" r="24" fill="var(--accent)" opacity="0.18"/>
      <circle cx="50" cy="50" r="16" fill="var(--accent)" class="pulse"/>
      <circle cx="50" cy="50" r="7" fill="#E9FCFF"/>
    </svg>
    <span>ATLAS</span>
  </a>
  <a href="#plans" class="navbtn" aria-label="Decisions waiting">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="3" width="16" height="18"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
    <i id="planbadge" class="badge" hidden></i>
  </a>
  <a href="#guard" class="navbtn" aria-label="Guardrails">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
  </a>
</nav>
</body>
</html>
